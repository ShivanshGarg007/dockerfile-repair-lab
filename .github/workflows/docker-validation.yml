name: Docker image validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/dockerfile-build"]

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: app:fixed

      - name: Run container and smoke test
        run: |
          docker run -d --name app-under-test -p 8080:8080 app:fixed
          trap 'docker logs app-under-test || true; docker rm -f app-under-test || true' EXIT
          for i in $(seq 1 20); do
            if curl --fail --silent http://localhost:8080/ > /tmp/home.html; then
              break
            fi
            sleep 1
          done
          grep -q "Docker Repair Lab Running Successfully" /tmp/home.html
          curl --fail --silent http://localhost:8080/api/status | grep -q '"status":"ok"'
