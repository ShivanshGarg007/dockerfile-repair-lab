name: Docker image validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/dockerfile-build"]

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: app:fixed

      - name: Run container and smoke test
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name app-under-test -p 8080:8080 app:fixed
          cleanup() {
            docker logs app-under-test || true
            docker rm -f app-under-test || true
          }
          trap cleanup EXIT

          # Wait for the server before checking the content.
          ready=false
          for i in $(seq 1 20); do
            if curl --fail --silent http://localhost:8080/ > /tmp/home.html; then
              ready=true
              break
            fi
            sleep 1
          done

          if [ "$ready" != true ]; then
            echo "Home page did not become ready"
            exit 1
          fi
          grep -q "Docker Repair Lab Running Successfully" /tmp/home.html

          curl --fail --silent http://localhost:8080/api/status > /tmp/status.json
          grep -q '"status":"ok"' /tmp/status.json
